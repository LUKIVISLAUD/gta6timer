<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    background-color: black;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-shadow: 2px 2px 8px #000;
    position: relative;
    background: url('gta-6-official-artwork-no-logo-1600.jpg') no-repeat center center/cover;
    background-size: cover;
    height: 100vh;
    animation: zoomOut 5s ease-out forwards;
  }

  @keyframes zoomOut {
    0% {
      transform: scale(1.3);
    }
    100% {
      transform: scale(1);
    }
  }

  .logo {
    width: 500px;
    max-width: 90%;
    animation: fadeInLogo 5s ease-in-out forwards;
    opacity: 0;
    margin-bottom: -15vh; /* To odpowiada poprzedniemu top: -15vh na PC */
  }

  @keyframes fadeInLogo {
    0% {
      opacity: 0;
      transform: scale(0.6);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  .timer {
    font-size: 3rem;
    margin-top: 50px;
    background: rgba(0, 0, 0, 0.7);
    padding: 30px 50px;
    border-radius: 15px;
    animation: fadeInTimer 5s ease-in-out forwards;
    opacity: 0;
    color: #fff;
    text-shadow: 0 0 8px rgba(138, 43, 226, 0.8), 0 0 15px rgba(138, 43, 226, 0.6);
    box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
  }

  @keyframes fadeInTimer {
    0% {
      opacity: 0;
      transform: scale(0.9);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Media Queries */
  /* Na telefonach (mniejsze ekrany) */
  @media screen and (max-width: 768px) {
    .logo {
      margin-bottom: -5vh; /* Logo wyżej */
      width: 80%;
    }

    .timer {
      font-size: 2rem;
      margin-top: 20px;
      padding: 20px 30px;
    }
  }

  @media screen and (max-width: 480px) {
    .logo {
      margin-bottom: -3vh; /* Jeszcze wyżej na bardzo małych ekranach */
      width: 90%;
    }

    .timer {
      font-size: 1.5rem;
      margin-top: 10px;
      padding: 15px 20px;
    }
  }
</style>
