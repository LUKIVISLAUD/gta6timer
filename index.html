<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Countdown</title>

  <!-- Favicony -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: auto; /* Zezwala na przewijanie */
      background-color: black;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 2px 2px 8px #000;
      position: relative;
      background: url('gta-6-official-artwork-no-logo-1600.jpg') no-repeat center center/cover;
      background-size: cover;
      height: 100vh;
      animation: zoomOut 5s ease-out forwards;
    }

    @keyframes zoomOut {
      0% {
        transform: scale(1.3);
      }
      100% {
        transform: scale(1);
      }
    }

    .logo {
      position: relative;
      top: -270px; /* To ustawienie było wcześniej */
      width: 500px;
      max-width: 90%;
      animation: fadeInLogo 5s ease-in-out forwards;
      opacity: 0;
    }

    @keyframes fadeInLogo {
      0% {
        opacity: 0;
        transform: scale(0.6);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .timer {
      font-size: 3rem;
      margin-top: 50px;
      background: rgba(0, 0, 0, 0.7);
      padding: 30px 50px;
      border-radius: 15px;
      animation: fadeInTimer 5s ease-in-out forwards;
      opacity: 0;
      color: #fff;
      text-shadow: 0 0 8px rgba(138, 43, 226, 0.8), 0 0 15px rgba(138, 43, 226, 0.6);
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
    }

    @keyframes fadeInTimer {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Media Queries */
    /* Na telefonach (mniejsze ekrany) */
    @media screen and (max-width: 768px) {
      .logo {
        top: -600px; /* Zwiększamy przesunięcie na telefonach */
        width: 80%;
      }

      .timer {
        font-size: 2rem;
        margin-top: 20px;
        padding: 20px 30px;
      }
    }

    @media screen and (max-width: 480px) {
      .logo {
        top: -200px; /* Jeszcze bardziej wyżej na mniejszych ekranach */
        width: 90%;
      }

      .timer {
        font-size: 1.5rem;
        margin-top: 10px;
        padding: 15px 20px;
      }
    }

  </style>
</head>
<body>

  <!-- Logo -->
  <img src="gta-6-logo-official-artwork-1600.jpg" alt="GTA 6 Logo" class="logo" />

  <!-- Timer -->
  <div class="timer" id="countdown">
    Odliczanie...
  </div>

  <script>
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("2026-05-26T00:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownElement.innerHTML = "GTA 6 JUŻ TU JEST!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownElement.innerHTML = `${days} dni ${hours}h ${minutes}min ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
