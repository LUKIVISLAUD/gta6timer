<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Countdown</title>
  
  <!-- Favicon i Ikony -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" sizes="512x512" href="android-chrome-512x512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background-color: black;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 2px 2px 8px #000;
      position: relative;
      background: url('gta-6-official-artwork-no-logo-1600.jpg') no-repeat center center/cover;
      background-size: cover;
      height: 100vh;
      animation: zoomOut 5s ease-out forwards;
      padding: 20px;
      box-sizing: border-box;
    }

    @keyframes zoomOut {
      0% {
        transform: scale(1.3);
      }
      100% {
        transform: scale(1);
      }
    }

    .logo {
      width: 500px;
      max-width: 90%;
      animation: fadeInLogo 5s ease-in-out forwards;
      opacity: 0;
      margin-bottom: 30px;
    }

    @keyframes fadeInLogo {
      0% {
        opacity: 0;
        transform: scale(0.6);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .timer {
      font-size: 3rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 30px 50px;
      border-radius: 15px;
      animation: fadeInTimer 5s ease-in-out forwards;
      opacity: 0;
      color: #fff;
      text-shadow: 0 0 8px rgba(138, 43, 226, 0.8), 0 0 15px rgba(138, 43, 226, 0.6);
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
    }

    @keyframes fadeInTimer {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media screen and (max-width: 768px) {
      .logo {
        width: 80%;
        margin-bottom: 20px;
      }

      .timer {
        font-size: 2rem;
        padding: 20px 30px;
      }
    }

    @media screen and (max-width: 480px) {
      .logo {
        width: 90%;
        margin-bottom: 15px;
      }

      .timer {
        font-size: 1.5rem;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="gta-6-logo-official-artwork-1600.jpg" alt="GTA 6 Logo" class="logo">

  <!-- Timer -->
  <div class="timer" id="countdown">
    Odliczanie...
  </div>

  <script>
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("2026-05-26T00:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownElement.innerHTML = "GTA 6 JUŻ TU JEST!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownElement.innerHTML = `
        ${days} dni ${hours}h ${minutes}min ${seconds}s
      `;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
